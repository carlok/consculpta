# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests help shape Consculpta. Small, focused ideas are easiest to review.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What pain point or opportunity does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits the browser-only, no-backend architecture.
          required: false
        - label: I am willing to open a PR if the idea is accepted.
          required: false
