# SPDX-License-Identifier: Apache-2.0
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ea9d6af671b862f1510396 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970b6f3c327a6f134329e5ee46a337d5d # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run characterization tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ea9d6af671b862f1510396 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970b6f3c327a6f134329e5ee46a337d5d # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run characterization tests
        run: npm test

      - name: Prepare static site
        run: |
          mkdir -p _site/legacy _site/third_party
          cp index.html _site/
          cp -r legacy/. _site/legacy/
          cp -r third_party/fonts _site/third_party/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@4f7eaefc2ad35080a226fabe1de4ad1a455d9c88 # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc37e28f0dd5a991bcc9bae55e06ad01d5536 # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5be089babd080377a7249c74bb281 # v4.0.5
